name: Psych Engine Android 12

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Haxe 4.3.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.5

      - name: Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install newgrounds
          haxelib install actuate
          haxelib install hxCodec
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          haxelib git extension-webm https://github.com/KadeDev/extension-webm.git
          haxelib run lime setup -y
          haxelib run openfl setup -y

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 12 SDK + NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-31" \
                     "build-tools;31.0.0" \
                     "ndk;23.2.8568313"

      - name: Build APK (Android 12)
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
          lime build android -debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Android12
          path: export/android/bin/app/build/outputs/apk/debug/*.apk
